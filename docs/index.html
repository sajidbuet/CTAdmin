      <div>
        <h1>CT Admin</h1>
        <small>Class Test Timer and Seat Plan</small>
      </div>
    </div>
    <nav class="actions" aria-label="View">
      <button id="toggleTimerBtn" class="btn tool" aria-pressed="true" title="Show/hide timer"><span class="ico">⏱</span><span class="lbl">Timer</span></button>
      <button id="togglePlanBtn" class="btn tool" aria-pressed="true" title="Show/hide seat plan"><span class="ico">🪑</span><span class="lbl">Plan</span></button>
      <button id="themeToggle" class="btn tool" title="Light / dark theme"><span class="ico">🌙</span><span class="lbl">Theme</span></button>
      <button id="fsToggle" class="btn tool" title="Fullscreen (F)"><span class="ico">⛶</span><span class="lbl">Fullscreen</span></button>
      <button id="settingsGear" class="btn tool" title="Settings"><span class="ico">⚙️</span><span class="lbl">Settings</span></button>
      <button id="projBtn" class="btn primary" title="Projection mode (P)"><span class="ico">📽</span><span class="lbl">Project</span></button>
    </nav>
  </header>

  <!-- ───────── Stage: timer + plan ───────── -->
  <main id="stage">

    <section id="timerBox" aria-label="Countdown timer">
      <svg id="pie" viewBox="0 0 614 614" role="img" aria-label="Countdown dial">
        <circle id="remainingmin" cx="307" cy="307" r="269" fill="none" stroke-width="61"/>
        <circle id="pieFill" cx="307" cy="307" r="269" fill="none" stroke="var(--pri)" stroke-width="61"
                stroke-dasharray="1690" stroke-dashoffset="1690" transform="rotate(-90 307 307)"/>
        <text id="timeLabel" x="307" y="307" text-anchor="middle" dominant-baseline="central"
              font-size="170">00:00</text>
        <text id="precount" x="307" y="307" text-anchor="middle" dominant-baseline="central"
              font-size="170" display="none">3</text>
      </svg>

      <div class="clock">
        <div id="dateTime"></div>
        <div id="endTime">_</div>
      </div>

      <div class="timer-controls">
        <div class="duration-row">
          <label for="durationInput">Minutes</label>
          <div class="stepper">
            <button type="button" id="durDec" class="btn tool" aria-label="Decrease duration">−</button>
            <input id="durationInput" type="number" min="1" max="180" step="1" value="20" inputmode="numeric">
            <button type="button" id="durInc" class="btn tool" aria-label="Increase duration">+</button>
          </div>
          <div class="chips">
            <button class="quick btn chip" data-min="10">10</button>
            <button class="quick btn chip" data-min="15">15</button>
            <button class="quick btn chip" data-min="20">20</button>
          </div>
        </div>

        <div class="chips adjust-row">
          <button class="adj btn chip" data-sec="-60">−1 min</button>
          <button class="adj btn chip" data-sec="60">+1 min</button>
          <button class="adj btn chip" data-sec="300">+5 min</button>
          <button class="adj btn chip" data-sec="30">+30 s</button>
        </div>

        <div class="run-row">
          <button id="startBtn" class="btn go">Start</button>
          <button id="pauseBtn" class="btn warn" disabled>Pause</button>
          <button id="resetBtn" class="btn stop" disabled>Reset</button>
        </div>

        <div class="sound-row">
          <button id="volumeIcon" class="btn tool" aria-label="Mute / unmute">🔉</button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" title="Audio volume" aria-label="Volume">
          <label class="check"><input type="checkbox" id="precountToggle" checked> 3-2-1 pre-count</label>
        </div>
      </div>
    </section>

    <section id="planPanel" aria-label="Seat plan">
      <details id="planOptions" class="plan-options" open>
        <summary>Seat plan options</summary>
        <div class="opt-grid">
          <label>Section
            <select id="sectionSelect">
              <option value="A">A (1‑65)</option><option value="B">B (66‑130)</option><option value="C">C (131‑195)</option>
              <option value="A1">A1</option><option value="A2">A2</option>
              <option value="B1">B1</option><option value="B2">B2</option>
              <option value="C1">C1</option><option value="C2">C2</option>
            </select>
          </label>
          <label>Start side
            <select id="startSide"><option value="left">Left</option><option value="right">Right</option></select>
          </label>
          <label>Start row
            <select id="startRow"><option value="top">Top</option><option value="bottom">Bottom</option></select>
          </label>
          <label>Pattern
            <select id="pattern">
              <option value="raster">Raster (row→row)</option>
              <option value="serpentine">Serpentine (row→row)</option>
              <option value="raster-col">Raster (column→column)</option>
              <option value="serpentine-col">Serpentine (column→column)</option>
              <option value="random">Random</option>
            </select>
          </label>
          <button id="generateBtn" class="btn primary">Generate</button>
        </div>
      </details>
      <div id="planHolder"></div>
    </section>
  </main>

  <footer class="page-footer">

  </footer>
</div>

<!-- ───────── Phone tab bar ───────── -->
<nav id="tabBar" aria-label="Panels">
  <button id="tabTimer" class="active">⏱ Timer</button>
  <button id="tabPlan">🪑 Seat plan</button>
</nav>

<!-- ───────── Projection controls (auto-hide) ───────── -->
<div id="projBar" role="toolbar" aria-label="Projection controls">
  <button id="projPlay" class="btn go" title="Start / pause (Space)">▶</button>
  <button id="projReset" class="btn stop" title="Reset" disabled>■</button>
  <button id="projMute" class="btn tool" title="Mute / unmute">🔉</button>
  <button id="projExit" class="btn tool" title="Exit projection (Esc)">✕ Exit</button>
</div>

<!-- ───────── Settings modal ───────── -->
<div id="settingsModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <button id="settingsClose" class="modal-close" aria-label="Close">✕</button>
    <h2>Settings</h2>

    <div class="settings-group">
      <label>Projection layout
        <select id="projLayout">
          <option value="auto">Auto (by screen shape)</option>
          <option value="side">Timer beside plan</option>
          <option value="stack">Timer above plan</option>
          <option value="timer">Timer only</option>
          <option value="plan">Plan only</option>
        </select>
      </label>
    </div>

    <h3>Custom seat settings</h3>
    <label class="check"><input type="checkbox" id="useCustomSettings"> Use custom settings</label>
    <div id="customSettings" class="settings-group">
      <label>Start roll <input type="number" id="customStartRoll" min="1"></label>
      <label>Student count <input type="number" id="customStudentCount" min="1"></label>
      <label>Section label <input type="text" id="customSectionLabel"></label>
      <label>Seat rows <input type="number" id="customSeatRows" min="1"></label>
      <label>Seat columns <input type="number" id="customSeatCols" min="1"></label>
    </div>
    <div class="settings-actions">
      <button id="saveSettings" class="btn tool">💾 Save</button>
      <input type="file" id="loadSettings" accept=".json" style="display:none">
      <button id="loadSettingsBtn" class="btn tool">📂 Load</button>
    </div>
  </div>
</div>

<!-- ───────── License modal ───────── -->
<div id="mitModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <button id="mitCloseBtn" class="modal-close" aria-label="Close">✕</button>
    <h2>MIT License</h2>
    <pre id="mitText" class="modal-text"></pre>
  </div>
</div>
</body>
</html>
